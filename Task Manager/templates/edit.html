<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container container-sm">
        <header class="app-header">
            <div>
                <h1>Edit Task</h1>
                <p class="subtitle">Modify task details, deadline, priority, or status.</p>
            </div>
        </header>

        <section class="card form-card">
            <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="POST" class="task-form">
                <div class="form-group">
                    <label for="title">Task Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" value="{{ task['title'] }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3">{{ task['description'] }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="deadline">Deadline</label>
                        <input type="date" id="deadline" name="deadline" value="{{ task['deadline'] }}">
                    </div>

                    <div class="form-group flex-1">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="Low" {% if task['priority'] == 'Low' %}selected{% endif %}>Low</option>
                            <option value="Medium" {% if task['priority'] == 'Medium' %}selected{% endif %}>Medium</option>
                            <option value="High" {% if task['priority'] == 'High' %}selected{% endif %}>High</option>
                        </select>
                    </div>

                    <div class="form-group flex-1">
                        <label for="status">Status</label>
                        <select id="status" name="status">
                            <option value="Pending" {% if task['status'] == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="In Progress" {% if task['status'] == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Completed" {% if task['status'] == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions space-between">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">&larr; Back to Tasks</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
