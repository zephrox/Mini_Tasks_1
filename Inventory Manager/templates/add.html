<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Inventory Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Add New Product</h1>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to List</a>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flashes">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('add_product') }}" method="POST" class="form-container">
            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="sku">SKU *</label>
                <input type="text" id="sku" name="sku" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>
            <div class="form-group">
                <label for="quantity">Initial Quantity *</label>
                <input type="number" id="quantity" name="quantity" value="0" required>
            </div>
            <div class="form-group">
                <label for="threshold">Low Stock Threshold *</label>
                <input type="number" id="threshold" name="threshold" value="5" required>
            </div>
            
            <button type="submit" class="btn">Add Product</button>
        </form>
    </div>
</body>
</html>
